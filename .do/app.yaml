# DigitalOcean App Platform spec for Jev Ticket Triage.
#   doctl apps create --spec .do/app.yaml
# or paste into the App Platform UI (app Settings -> App Spec -> Edit).
name: jev-ticket-triage
region: nyc
services:
  - name: web
    github:
      repo: paddix/JEV
      branch: main
      deploy_on_push: true
    environment_slug: python
    run_command: gunicorn --worker-tmp-dir /dev/shm --bind 0.0.0.0:8080 app:app
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
    envs:
      - key: TYPESAFE_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""  # set in the App Platform UI; stored encrypted
      - key: JEV_MODEL
        scope: RUN_TIME
        value: jev-latest
