# DigitalOcean App Platform spec for Jev Ticket Triage.
# Replace the repo below with your GitHub repo, then create the app:
#   doctl apps create --spec .do/app.yaml
# or import this spec in the App Platform UI (Create App -> Edit App Spec).
name: jev-ticket-triage
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/jev-ticket-triage
      branch: main
      deploy_on_push: true
    environment_slug: python
    run_command: gunicorn --worker-tmp-dir /dev/shm --bind 0.0.0.0:8080 app:app
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
    envs:
      - key: TYPESAFE_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""  # set in the App Platform UI or via doctl; stored encrypted
      - key: JEV_MODEL
        scope: RUN_TIME
        value: jev-latest
